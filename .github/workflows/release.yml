name: release

on:
  push:
    tags:
      - v*

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        oem: ["", arcfra]
    steps:
      - id: get_version
        run: echo "version=${GITHUB_REF/refs\/tags\//}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ matrix.oem == 'arcfra' && secrets.DOCKERHUB_USERNAME_ARCFRA || secrets.DOCKERHUB_USERNAME }}
          password: ${{ matrix.oem == 'arcfra' && secrets.DOCKERHUB_TOKEN_ARCFRA || secrets.DOCKERHUB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          registry: ccr.ccs.tencentyun.com
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          tags: |
            ${{ matrix.oem == 'arcfra' && 'arcfra' || 'smartxworks' }}/volume-modifier-for-k8s:${{ steps.get_version.outputs.version }}
            ccr.ccs.tencentyun.com/${{ matrix.oem == 'arcfra' && 'arcfra' || 'smartxworks' }}/volume-modifier-for-k8s:${{ steps.get_version.outputs.version }}
          platforms: linux/amd64,linux/arm64
          push: true
